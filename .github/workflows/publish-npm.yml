name: Publish package to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NPM_CONFIG_PROVENANCE: true
  HUSKY: 0

jobs:
  validate:
    name: Validate before publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm & Node.js
        uses: ./.github/actions/setup

      - name: Ensure package version matches git tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Type package exports
        run: node -e "const p=require('./package.json'); if(!p.exports || !p.types){ throw new Error('Missing exports/types in package.json'); }"

      - name: Smoke check package tarball
        run: npm pack --dry-run

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve npm dist-tag from version
        id: dist_tag
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$PKG_VERSION" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug npm context
        run: |
          npm config get registry
          npm view @shad0wz7/nestjs-pdf name version --registry=https://registry.npmjs.org/
          node -p "require('./package.json').name"
          node -p "require('./package.json').version"
          echo "Workflow ref: $GITHUB_REF"
          echo "Workflow ref name: $GITHUB_REF_NAME"

      - name: Publish to npm
        run: npm publish --ignore-scripts --access public --tag "${{ steps.dist_tag.outputs.npm_tag }}"
