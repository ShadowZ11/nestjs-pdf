name: ✨ Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please search [existing issues](https://github.com/ShadowZ11/nestjs-pdf/issues) first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's missing or painful today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? An API sketch is welcome.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today or other approaches you thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Providers (Puppeteer / Gotenberg / Api2Pdf / new provider)
        - Template engines
        - PDF post-processing (merge, metadata, pdf-lib…)
        - Security
        - Module configuration / DX
        - Documentation
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request for this feature
